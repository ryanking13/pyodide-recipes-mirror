name: Build Recipes

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      scipy:
        description: 'Run SciPy test suite'
        required: false
        default: false
        type: boolean
  schedule:
  # Twice per week, on Monday and Thursday
  - cron: "0 0 * * 1,4"

permissions:
  contents: write
  pull-requests: write

env:
  # Increase this value to reset cache if environment.yml has not changed
  CONDA_CACHE_NUMBER: 0
  CCACHE_DIR: /tmp/.ccache
  CCACHE_CACHE_NUMBER: 0
  FORCE_COLOR: 3

jobs:
  check-scipy-test-trigger:
    runs-on: ubuntu-latest
    outputs:
      test-scipy: ${{ steps.check-build-trigger.outputs.trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Check if SciPy tests should run
        id: check-build-trigger
        env:
          GITHUB_EVENT_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_EVENT_INPUTS_SCIPY: ${{ github.event.inputs.scipy }}
        # Run if commit_msg contains "[scipy]" or
        # if the PR has the "scipy" label or the "full build" label or
        # if the PR title contains "[scipy]" or if
        # the workflow is triggered manually with the `scipy` input set to true
        run: |
          set -ex

          COMMIT_MSG=$(git log --no-merges -1 --oneline)
          PR_TITLE="${GITHUB_EVENT_PULL_REQUEST_TITLE}"
          SCIPY_LABEL=${{ contains(github.event.pull_request.labels.*.name, 'scipy') }}
          FULL_BUILD_LABEL=${{ contains(github.event.pull_request.labels.*.name, 'full build') }}
          SCIPY_INPUT="${GITHUB_EVENT_INPUTS_SCIPY}"
          GITHUB_EVENT_NAME="${{ github.event_name }}"

          if [[ "$COMMIT_MSG" =~ \[scipy\] ]] || \
             [[ "$PR_TITLE" =~ \[scipy\] ]] || \
             [[ "$SCIPY_LABEL" == "true" ]] || \
             [[ "$FULL_BUILD_LABEL" == "true" ]] || \
             { [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && [[ "$SCIPY_INPUT" == "true" ]]; }
          then
            echo "SciPy tests will run"
            echo "trigger=true" >> $GITHUB_OUTPUT
          else
            echo "SciPy tests will not run"
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: [check-scipy-test-trigger]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Cache conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CONDA_CACHE_NUMBER }}-${{
            hashFiles('environment.yml') }}

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pyodide-env
          conda-remove-defaults: true
          channels: conda-forge

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache Conda env
        id: conda-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}-${{ steps.get-date.outputs.today }}-${{ hashFiles('environment.yml') }}-${{ env.CONDA_CACHE_NUMBER }}

      - name: Update environment if cache miss
        run:
          mamba env update -n pyodide-env -f environment.yml
        if: steps.conda-cache.outputs.cache-hit != 'true'

      # See https://github.com/jlumbroso/free-disk-space/issues/40
      - name: Disable man-db to free up disk space faster
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db

      - name: Free unused disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false # https://github.com/jlumbroso/free-disk-space/issues/12

      - name: Install latest pyodide-build and build dependencies
        run : |
          which python
          ./tools/prepare_pyodide_build.sh

      - name: Set Emscripten toolchain and pyodide-build versions for ccache
        run: |
          EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version)
          PYODIDE_BUILD_VERSION=$(python -m pip show pyodide-build | awk '/^Version:/{print $2}')

          echo "EMSCRIPTEN_VERSION=${EMSCRIPTEN_VERSION}" >> $GITHUB_ENV
          echo "PYODIDE_BUILD_VERSION=${PYODIDE_BUILD_VERSION}" >> $GITHUB_ENV

          echo "CCACHE_COMPILERCHECK=string:emscripten-${EMSCRIPTEN_VERSION}-pyodide-build-${PYODIDE_BUILD_VERSION}" >> $GITHUB_ENV

      - name: Set ccache suffix
        run: |
          # This step makes the cache key in the main branch and PRs different.
          # main branch run a full build, while PRs run a partial build
          # so we keep the ccache cache separate
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo CCACHE_SUFFIX="-pr" >> $GITHUB_ENV
          fi

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          # Make the key unique once per day because actions/cache does not
          # update an existing cache on an exact hit for a fully static key
          key: ccache-${{ env.CCACHE_CACHE_NUMBER }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.PYODIDE_BUILD_VERSION }}-${{ runner.os }}${{ env.CCACHE_SUFFIX }}-${{ steps.get-date.outputs.today }}
          restore-keys: |
            ccache-${{ env.CCACHE_CACHE_NUMBER }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.PYODIDE_BUILD_VERSION }}-${{ runner.os }}${{ env.CCACHE_SUFFIX }}-
            ccache-${{ env.CCACHE_CACHE_NUMBER }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.PYODIDE_BUILD_VERSION }}-${{ runner.os }}

      - name: Calculate recipes to build (pull_request)
        if: github.event_name == 'pull_request'
        id: calculate_recipes_pr
        env:
          DB_TEST_TRIGGER: ${{ contains(github.event.pull_request.labels.*.name, 'db') || contains(github.event.pull_request.labels.*.name, 'full build') }}
          GITHUB_EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
          NEEDS_CHECK_SCIPY_TEST_TRIGGER_OUTPUTS_TEST_SCIPY: ${{ needs.check-scipy-test-trigger.outputs.test-scipy }}
        run: |
          export CHANGED_RECIPES=$(python ./tools/calc_diff.py \
            --base origin/${GITHUB_EVENT_PULL_REQUEST_BASE_REF} \
            --target ${{ github.sha }})

          echo "Changed recipes: $CHANGED_RECIPES"

          # Check if scipy should be included
          SCIPY_WILL_BE_TESTED="${NEEDS_CHECK_SCIPY_TEST_TRIGGER_OUTPUTS_TEST_SCIPY}"

          # If there are no changed recipes, we build only core packages sets
          if [ -z "$CHANGED_RECIPES" ]; then
            # No changed recipes
            if [ "$SCIPY_WILL_BE_TESTED" == "true" ]; then
              echo "recipes=tag:core,scipy" >> "$GITHUB_OUTPUT"
              sed -i 's/unvendor-tests: true/unvendor-tests: false/' packages/scipy/meta.yaml
              echo "Building: tag:core,scipy (no changes + scipy trigger)"
            else
              echo "recipes=tag:core" >> "$GITHUB_OUTPUT"
              echo "Building: tag:core (no changes)"
            fi
          else
            # There are changed recipes
            if [ "$SCIPY_WILL_BE_TESTED" == "true" ]; then
              # Check if scipy is already in changed recipes to avoid duplication
              if [[ "$CHANGED_RECIPES" == *"scipy"* ]]; then
                echo "recipes=$CHANGED_RECIPES,tag:core" >> "$GITHUB_OUTPUT"
                sed -i 's/unvendor-tests: true/unvendor-tests: false/' packages/scipy/meta.yaml
                echo "Building: $CHANGED_RECIPES,tag:core (scipy already included in changes)"
              else
                echo "recipes=$CHANGED_RECIPES,tag:core,scipy" >> "$GITHUB_OUTPUT"
                sed -i 's/unvendor-tests: true/unvendor-tests: false/' packages/scipy/meta.yaml
                echo "Building: $CHANGED_RECIPES,tag:core,scipy (changes + scipy trigger)"
              fi
            else
              echo "recipes=$CHANGED_RECIPES,tag:core" >> "$GITHUB_OUTPUT"
              echo "Building: $CHANGED_RECIPES,tag:core (changes only)"
            fi
          fi

      - name: Apply scipy test configuration for workflow_dispatch scipy trigger
        if: github.event_name == 'workflow_dispatch' && needs.check-scipy-test-trigger.outputs.test-scipy == 'true'
        run: |
          sed -i 's/unvendor-tests: true/unvendor-tests: false/' packages/scipy/meta.yaml

      - name: Build recipes (full)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full build')
        run: |
          ccache -z
          export _EMCC_CCACHE=1

          export PIP_CONSTRAINT=$(pwd)/tools/constraints.txt
          mkdir -p result
          pyodide build-recipes "*" --install --install-dir=./repodata --log-dir=build-logs | tee result/build_output.log
          ccache -s

      - name: Build recipes (changed only)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full build')
        env:
          STEPS_CALCULATE_RECIPES_PR_OUTPUTS_RECIPES: ${{ steps.calculate_recipes_pr.outputs.recipes }}
        run: |
          ccache -z
          export _EMCC_CCACHE=1

          export PIP_CONSTRAINT=$(pwd)/tools/constraints.txt
          mkdir -p result
          pyodide build-recipes ${STEPS_CALCULATE_RECIPES_PR_OUTPUTS_RECIPES} --install --install-dir=./repodata --log-dir=build-logs | tee result/build_output.log
          ccache -s

      - name: Parse build results
        id: parse_results
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ -f result/build_output.log ]; then
            python tools/parse_build_result.py result/build_output.log > result/build_summary.md
            echo "SUMMARY_CREATED=true" >> $GITHUB_ENV
          else
            echo "No build log found"
            echo "SUMMARY_CREATED=false" >> $GITHUB_ENV
          fi

          echo ${PR_NUMBER} > result/pr_number
      - name: Compress build artifacts
        run: |
          tar -czvf packages.tar.gz -C repodata .

      - name: Copy Pyodide runtime to repodata for testing
        run: |
          ./tools/copy_pyodide_runtime.sh ./repodata
      - name: Store the build summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request' && env.SUMMARY_CREATED == 'true'
        with:
          name: build-result
          path: result/
          retention-days: 7

      - name: Store artifacts build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repodata
          path: ./repodata/
          retention-days: 7

      - name: Store build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ./build-logs/
          retention-days: 7

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ./packages.tar.gz
            ./repodata/pyodide-lock.json

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        test-config: [
          {runner: selenium, runtime: chrome, runtime-version: 134 },
          {runner: selenium, runtime: firefox, runtime-version: "136.0" },
          {runner: selenium, runtime: node, runtime-version: "24" },
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Cache conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CONDA_CACHE_NUMBER }}-${{
            hashFiles('environment.yml') }}

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pyodide-env
          conda-remove-defaults: true
          channels: conda-forge

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache Conda env
        id: conda-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}-${{ steps.get-date.outputs.today }}-${{ hashFiles('environment.yml') }}-${{ env.CONDA_CACHE_NUMBER }}

      - name: Update environment if cache miss
        run:
          mamba env update -n pyodide-env -f environment.yml
        if: steps.conda-cache.outputs.cache-hit != 'true'

      - uses: pyodide/pyodide-actions/install-browser@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          runner: ${{ matrix.test-config.runner }}
          browser: ${{ matrix.test-config.runtime }}
          browser-version: ${{ matrix.test-config.runtime-version }}

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repodata
          path: ./dist/

      - name: Install test dependencies
        run: |
          which python
          echo y | python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v \
            --dist-dir=./dist/ \
            -n $(nproc) \
            --runner=${{ matrix.test-config.runner }} \
            --rt ${{ matrix.test-config.runtime }} \
            --junitxml=test-results-${{ matrix.test-config.runtime }}.xml \
            packages

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@fdc7f18d9934e38aca411ca9557e6577bd25ca9c # v0.9.0
        with:
          path: test-results-${{ matrix.test-config.runtime }}.xml
          summary: true  # Always display overall test statistics summary
          display-options: fE  # Show detailed list only for failed (f) and error (E) tests
          fail-on-empty: true
          title: "Test Results - ${{ matrix.test-config.runtime }}"

      - name: Upload test results XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.test-config.runtime }}
          path: test-results-${{ matrix.test-config.runtime }}.xml
        if: always()

  test-db-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    needs: [build]
    if: contains(github.event.pull_request.labels.*.name, 'db') || contains(github.event.pull_request.labels.*.name, 'full build')
    services:
      mysql:
        image: mysql:8.0.45@sha256:4af1f8815716546f5b12410f7621f37f93db8dd11a184706ef59111930b8c2ff
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: pyodide_root_pw
          MYSQL_ROOT_HOST: "%"
        options: >-
          --health-cmd="mysqladmin ping -ppyodide_root_pw --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16@sha256:71e27bf60b70bded003791b5573f8b808365613f341df20ffcf0c1ed7bc13ddf
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: pyodide_root_pw
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pyodide-env
          conda-remove-defaults: true
          channels: conda-forge

      - uses: pyodide/pyodide-actions/install-browser@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          runner: selenium
          browser: node
          browser-version: "24"

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repodata
          path: ./dist/

      - name: Install test dependencies
        run: |
          which python
          python -m pip install -r requirements.txt

      - name: Run DB integration tests
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: bash tools/test_db_integration.sh


  # This job runs the SciPy tests based on the
  # checks above, separate from the main test job.
  test-scipy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    needs: [build, check-scipy-test-trigger]
    if: needs.check-scipy-test-trigger.outputs.test-scipy == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Cache conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CONDA_CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pyodide-env
          conda-remove-defaults: true
          channels: conda-forge

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache Conda env
        id: conda-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}-${{ steps.get-date.outputs.today }}-${{ hashFiles('environment.yml') }}-${{ env.CONDA_CACHE_NUMBER }}

      - name: Update environment if cache miss
        run:
          mamba env update -n pyodide-env -f environment.yml
        if: steps.conda-cache.outputs.cache-hit != 'true'

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repodata
          path: ./dist/

      - name: Prepare SciPy test suite
        run: |
          # Create Pyodide virtual environment
          pyodide venv .venv-pyodide
          source .venv-pyodide/bin/activate

          # Install test dependencies and built wheels, including SciPy
          pip install pytest hypothesis pooch
          pip install dist/numpy-*.whl
          pip install dist/scipy-*.whl

      - name: Copy test config files
        run: |
          rm -rf conftest.py
          cp packages/scipy/scipy-conftest.py packages/scipy/conftest.py

      - name: Run SciPy test suite
        run: |
          source .venv-pyodide/bin/activate
          cd packages/scipy
          pytest -c /dev/null -sra --pyargs scipy


  release: # deploy to pyodide channel
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pyodide-env
          conda-remove-defaults: true
          channels: conda-forge

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repodata
          path: ./repodata/

      - name: Install anaconda-client
        run: |
          mamba install -c defaults anaconda-client -y

      - name: Upload wheels
        run: |
          # Anaconda denies packages with long descriptions, so set summary to null
          anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --skip-existing ./repodata/*.whl --summary=" " --description=" "

  release-nightly:  # deploys to pyodide-nightly channel
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: deploy-nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pyodide-env
          conda-remove-defaults: true
          channels: conda-forge

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repodata
          path: ./repodata/

      - name: Install anaconda-client
        run: |
          mamba install -c defaults anaconda-client -y

      - name: Upload wheels
        run: |
          # Anaconda denies packages with long descriptions, so set summary to null
          anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --skip-existing ./repodata/*.whl --summary=" " --description=" "
