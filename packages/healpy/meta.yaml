package:
  name: healpy
  version: 1.19.0
  top-level:
    - healpy
source:
  url: https://files.pythonhosted.org/packages/source/h/healpy/healpy-1.19.0.tar.gz
  sha256: 28e839cb885a23d36c77fc3423a3cb9271a07fda94085bd12fc329f941130ec5
  patches:
    - patches/0001-Skip-linking-cfitsio-and-healpix_cxx-programs-for-Py.patch
    - patches/0002-without-zlib-check-fortran.patch
    - patches/0003-install-path.patch
requirements:
  host:
    - libzlib
    - numpy
  run:
    - numpy
    - astropy
build:
  vendor-sharedlib: true
  exports: requested
  cflags: |
    -I$(WASM_LIBRARY_DIR)/include
    -fwasm-exceptions
  cxxflags: |
    -fwasm-exceptions
  ldflags: |
    -fwasm-exceptions
  script: |
    export CXXFLAGS="$CXXFLAGS -sSIDE_MODULE=1"

    # Since Emscripten 6.0.0 `-shared` produces a real side module by default
    # so the vendored cfitsio and libsharp are real shared libraries and `-lcfitsio`
    # resolves to the .so instead of the .a. autoconf's AC_CHECK_LIB probes a library
    # by declaring the function itself as `char ffgnrwll (void);`, which does not match
    # the real prototype, and across a shared library boundary wasm-ld promotes the
    # resulting signature mismatch from a warning to an error.
    # So healpix_cxx's configure concludes the libraries are missing and fails.
    export ac_cv_lib_cfitsio_ffgnrwll=yes
    export ac_cv_lib_sharp_sharp_execute=yes
about:
  home: https://github.com/healpy/healpy
  PyPI: https://pypi.org/project/healpy
  summary: Healpix tools package for Python
  license: GPL-2.0-only
extra:
  recipe-maintainers:
    - juntyr
