package:
  name: lxml
  version: 6.1.3
  top-level:
    - lxml
source:
  sha256: 45222d94ddd511536f3b2f7d9deae3b2339b4ce0f075f1ca25703b07cad9dd21
  url: https://files.pythonhosted.org/packages/source/l/lxml/lxml-6.1.3.tar.gz
build:
  cflags: |
    -Wno-implicit-function-declaration
  ldflags: |
    -L$(WASM_LIBRARY_DIR)/lib
    -liconv
requirements:
  host:
    - libxml
    - libxslt
    - libzlib
    - libiconv
test:
  imports:
    - lxml
    - lxml.etree
    - lxml.objectify
about:
  home: https://lxml.de/
  PyPI: https://pypi.org/project/lxml
  summary:
    Powerful and Pythonic XML processing library combining libxml2/libxslt
    with the ElementTree API.
  license: BSD-3-Clause
